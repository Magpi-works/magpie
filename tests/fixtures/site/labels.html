<!doctype html>
<html>
  <head><title>Labels</title></head>
  <body>
    <form>
      <label for="who">Who are you billing?</label>
      <input id="who" placeholder="Northstar Hosting" />
      <span id="amount-label">Amount</span>
      <input aria-labelledby="amount-label" placeholder="0.00 USDC" />
      <label>Notes <input placeholder="Optional" /></label>
      <input placeholder="Only a placeholder" />
    </form>
  </body>
</html>
